<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, My Love ❤️</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #ffe4ec, #fff4d9, #e9ddff);
    overflow-x: hidden;
    color: #4a2140;
  }

  .hearts span {
    position: fixed;
    bottom: -30px;
    font-size: 22px;
    animation: float 9s linear infinite;
    opacity: .65;
    pointer-events: none;
  }
  .hearts span:nth-child(1){left:8%;animation-delay:0s}
  .hearts span:nth-child(2){left:22%;animation-delay:2s}
  .hearts span:nth-child(3){left:40%;animation-delay:4s}
  .hearts span:nth-child(4){left:62%;animation-delay:1s}
  .hearts span:nth-child(5){left:82%;animation-delay:3s}

  @keyframes float {
    from { transform: translateY(0) rotate(0deg); }
    to { transform: translateY(-115vh) rotate(360deg); }
  }

  .page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px 15px;
  }

  .card {
    width: min(720px, 95vw);
    background: rgba(255,255,255,.88);
    border-radius: 28px;
    padding: 38px 28px;
    text-align: center;
    box-shadow: 0 18px 55px rgba(100,40,80,.18);
    position: relative;
    z-index: 2;
  }

  .cake { font-size: 72px; animation: bounce 1.7s infinite; }
  @keyframes bounce {
    50% { transform: translateY(-10px); }
  }

  h1 {
    font-size: clamp(34px, 7vw, 58px);
    margin: 8px 0;
    color: #d63384;
  }

  h2 { color: #7b315d; margin-bottom: 10px; }
  p { font-size: 18px; line-height: 1.6; }

  button {
    border: 0;
    border-radius: 999px;
    padding: 14px 25px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
  }

  .start, .yes {
    background: #d63384;
    color: white;
    box-shadow: 0 7px 18px rgba(214,51,132,.28);
  }

  .start:hover, .yes:hover { transform: scale(1.06); }

  .question-area {
    position: relative;
    min-height: 180px;
    margin-top: 20px;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 18px;
    align-items: center;
    min-height: 90px;
  }

  .no {
    background: #eee;
    color: #555;
    position: relative;
    transition: left .18s ease, top .18s ease, transform .18s ease;
  }

  .hidden { display: none !important; }

  .progress {
    margin-top: 18px;
    font-size: 14px;
    color: #95617f;
  }

  .final {
    animation: appear .7s ease;
  }

  @keyframes appear {
    from { opacity:0; transform:scale(.85); }
    to { opacity:1; transform:scale(1); }
  }

  .signature {
    margin-top: 25px;
    font-weight: 700;
    color: #d63384;
  }

  .confetti {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 18px;
    animation: fall 3s linear forwards;
    z-index: 10;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .tiny {
    font-size: 13px;
    opacity: .7;
    margin-top: 15px;
  }
</style>
</head>

<body>
<div class="hearts">
  <span>❤️</span><span>💗</span><span>💕</span><span>💖</span><span>💘</span>
</div>

<div class="page">
  <main class="card" id="app">
    <div class="cake">🎁</div>
    <h1>Something Special Is Waiting... ❤️</h1>
    <p>Kuchu Puchu, your birthday surprise will unlock at exactly</p>
    <h2>12:00 AM • 2 October 🎂</h2>
    <div id="countdown" style="font-size:clamp(30px,7vw,52px);font-weight:800;color:#d63384;margin:25px 0;">Loading...</div>
    <p>Keep this page open. At midnight, your birthday surprise will begin automatically. 💕</p>
    <div class="tiny">Countdown is based on India Standard Time (IST).</div>
  </main>
</div>

<script>
// Birthday unlock time: 2 October 2026, 12:00 AM IST.
const birthdayTime = new Date("2026-10-02T00:00:00+05:30").getTime();
let countdownTimer;

function updateCountdown() {
  const box = document.getElementById("countdown");
  if (!box) return;
  const remaining = birthdayTime - Date.now();
  if (remaining <= 0) { clearInterval(countdownTimer); startBirthdayExperience(); return; }
  const totalSeconds = Math.floor(remaining / 1000);
  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  box.innerHTML = `${String(days).padStart(2,"0")} DAYS<br>${String(hours).padStart(2,"0")} : ${String(minutes).padStart(2,"0")} : ${String(seconds).padStart(2,"0")}`;
}

function startBirthdayExperience() {
  document.getElementById("app").innerHTML = `
    <div class="cake">🎂</div>
    <h1>Happy Birthday, Kuchu Puchu! ❤️</h1>
    <p>Today is not just your birthday...<br>It's the day the world became a little more beautiful. ✨</p>
    <p>But before I give you your birthday surprise, you have to pass a very important test. 😌</p>
    <button class="start" onclick="startQuiz()">Start Your Birthday Test 💕</button>`;
  makeConfetti();
}

countdownTimer = setInterval(updateCountdown, 1000);
updateCountdown();

const questions = [
  "Do you agree that you are the cutest person in my world? 🥰",
  "Do you promise to keep smiling because your smile is my favourite? 😊",
  "Will you accept unlimited hugs from me today? 🤗",
  "Do you agree that I am allowed to annoy you forever? 😜",
  "Will you let me spoil you a little extra today? 🎁",
  "Do you promise to stay with me through all the crazy adventures ahead? ❤️",
  "And finally... do you know how incredibly special you are to me? 💖",
  "Are you ready to fulfill all my fantasies? 😏❤️"
];

let current = 0;

function startQuiz() {
  showQuestion();
}

function showQuestion() {
  const q = questions[current];
  document.getElementById("app").innerHTML = `
    <div class="cake">💝</div>
    <h2>${q}</h2>
    <div class="question-area">
      <div class="buttons">
        <button class="yes" onclick="answerYes()">YES ❤️</button>
        <button class="no" id="noBtn"
          onmouseenter="runAway()"
          ontouchstart="runAway()"
          onclick="runAway()">NO 😏</button>
      </div>
    </div>
    <div class="progress">Question ${current + 1} of ${questions.length}</div>
    <div class="tiny">Hint: The “NO” button seems unusually shy today. 😂</div>
  `;
}

function answerYes() {
  current++;
  if (current < questions.length) {
    showQuestion();
  } else {
    showFinal();
  }
}

function runAway() {
  const btn = document.getElementById("noBtn");
  if (!btn) return;

  const area = document.querySelector(".question-area");
  const maxX = Math.max(20, area.clientWidth - btn.offsetWidth - 20);
  const maxY = Math.max(20, area.clientHeight - btn.offsetHeight - 20);

  const x = Math.random() * maxX - maxX / 2;
  const y = Math.random() * maxY - maxY / 2;

  btn.style.transform = `translate(${x}px, ${y}px) rotate(${Math.random()*18-9}deg)`;
}

function showFinal() {
  document.getElementById("app").innerHTML = `
    <div class="final">
      <div class="cake">🎂💖🎉</div>
      <h1>Mission Accomplished! ❤️</h1>
      <h2>You said YES to everything! 😍</h2>
      <p>
        Which means you are officially required to have the
        <strong>BEST BIRTHDAY EVER!</strong> 🥳
      </p>
      <p>
        Thank you for being my happiness, my favourite person,
        and the most beautiful part of my life. 💕
      </p>
      <p>
        May your day be filled with laughter, love, surprises,
        cake, and everything that makes you smile. 🎁🌸
      </p>
      <p class="signature">Happy Birthday, Kuchu Puchu. ❤️<br>Forever yours, Kuchu Puchu. 💋</p>
    </div>
  `;
  makeConfetti();
}

function makeConfetti() {
  const symbols = ["💖","💕","✨","🎉","💗","🌸","⭐","🎀"];
  for (let i = 0; i < 70; i++) {
    const el = document.createElement("div");
    el.className = "confetti";
    el.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    el.style.left = Math.random()*100 + "vw";
    el.style.animationDelay = Math.random()*1.5 + "s";
    el.style.fontSize = (14 + Math.random()*18) + "px";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4500);
  }
}
</script>
</body>
</html>
